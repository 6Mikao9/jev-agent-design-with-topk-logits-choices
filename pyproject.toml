[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jev-agent-prototype"
version = "0.1.0"
description = "A small Jev tool-agent prototype with explicit Top-k logits fallback"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
models = ["torch", "transformers"]
dev = ["ruff"]

[tool.setuptools.packages.find]
include = ["jev_agent*", "jev_tools*"]
